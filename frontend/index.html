<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Mad Libs</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.13.0/css/all.css">
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
    <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->

    <header>
        <h1>Mad Libs</h1>
    </header>

    <main>
        <form id="theme">
            <fieldset>
                <legend>
                    <h2>Select a theme for your story</h2>
                </legend>

                <div class="col">
                    <div class="row">
                        <input type="radio" class="theme1" name="theme" value="theme1" checked />
                        <label for="theme1" class="theme1">Loading Themes...</label>
                    </div>
                    <div class="row">
                        <input type="radio" class="theme2" name="theme" value="theme2" />
                        <label for="theme2" class="theme2">Loading Themes...</label>
                    </div>
                    <div class="row">
                        <input type="radio" class="theme3" name="theme" value="theme3" />
                        <label for="theme3" class="theme3">Loading Themes...</label>
                    </div>
                    <div class="row">
                        <input type="radio" class="theme4" name="theme" value="theme4" />
                        <label for="theme4" class="theme4">Loading Themes...</label>
                    </div>
                    <div class="row">
                        <input type="radio" class="theme5" name="theme" value="theme5" />
                        <label for="theme5" class="theme5">Loading Themes...</label>
                    </div>
                    <div class="row">
                        <input type="radio" class="theme6" name="theme" value="theme6" />
                        <label for="theme6" class="theme6">Loading Themes...</label>
                    </div>
                </div>

                <div id="theme-error" class="error"></div>
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <a href="http://kaitrice.com" target="_blank" rel="noopener noreferrer" class="link">Portfolio</a>
    </footer>

    <script src="index.js" async defer></script>
</body>

</html>
